sonar.projectKey=naveen3830_ai_stock_prediction
sonar.organization=naveen3830

# Project metadata displayed in SonarCloud
sonar.projectName=S&P 500 Price Predictor
sonar.projectVersion=2.1

# Source directories for frontend and backend
sonar.sources=backend,frontend/src

# Exclude dependencies, build artifacts, temporary caches, and scratch files
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.cache/**,**/cache/**,**/__pycache__/**,**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/scratch/**,**/.scannerwork/**,**/Dockerfile,**/*.dockerfile

# Source encoding
sonar.sourceEncoding=UTF-8

# Target Python versions
sonar.python.version=3.10,3.11,3.12

# Coverage exclusions (unit test suites pending)
sonar.coverage.exclusions=**

# Ignore snake_case naming enforcement to support strict camelCase project standards
sonar.issue.ignore.multicriteria=ruleCamelCaseFunc,ruleCamelCaseVar,ruleUnusedLoop,rulePathTraversal,ruleLogInjection,ruleDockerRoot,ruleDockerCopy,ruleDockerPipBinary,ruleDockerPipLock
